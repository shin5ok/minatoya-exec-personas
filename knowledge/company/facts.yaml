# - 金額の単位は「億円」（特記なき限り）。
# - 決算期は2月末。期のキーは「期末の年-月」で表します。
#     "2026-02"        = 2026年2月期（2025年3月〜2026年2月）
#     h1 の "2027-02"  = 2027年2月期 中間期（2026年3月〜8月）
# - 他ファイルの数字はここに合わせます。`python3 scripts/validate.py` で検算できます。
# =====================================================================
