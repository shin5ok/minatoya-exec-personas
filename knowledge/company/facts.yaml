timeline:
  - {date: "1962-04", event: 杉村源吉が清水港近くで「港屋商店」（青果・乾物の卸）を創業。オート三輪1台で配達した}
  - {date: "1970-10", event: スーパー1号店「みなとや 入江店」（清水）を開店}
  - {date: "1973-06", event: 株式会社港屋を設立（法人化）}
  - {date: "1981-03", event: 浜松市に出店し遠州地区へ進出。配送は地元の運送会社に委託}
  - {date: "1986-09", event: 社名を株式会社ミナトヤに変更}
  - {date: "1990-05", event: 杉村健三（創業者の長男）が2代目社長に就任}
  - {date: "1991-11", event: 初の自社物流センター「清水DC」が稼働}
  - {date: "1995-04", event: 配送委託に競争入札を導入（遠州地区の委託先が大きく入れ替わる）}
  - {date: "1998-02", event: 基幹システム「MOSS」が稼働}
  - {date: "2001-03", event: 東証二部に上場}
  - {date: "2004-09", event: 愛知県に進出}
  - {date: "2006-03", event: 東証一部に指定}
  - {date: "2008-04", event: 株式会社ミナトヤ・ロジスティクスを設立し、3PL外販を開始}
  - {date: "2010-04", event: 神奈川県に進出}
  - {date: "2012-10", event: 山梨県・長野県に進出}
  - {date: "2014-04", event: 協力会社との取引ルール「パートナー憲章」を制定（荷待ち時間の有償化・燃料サーチャージ連動など）}
  - {date: "2015-09", event: 持株会社体制へ移行し、ミナトヤ・ホールディングス株式会社に商号変更}
  - {date: "2016-10", event: 都市型小型店「ミナトヤ Quick」1号店（静岡駅前）を開店}
  - {date: "2018-07", event: ネットスーパーを開始}
  - {date: "2019-04", event: 浜松の物流センターでカートグラフ社の協働ロボット実証を開始}
  - {date: "2021-05", event: 望月誠一郎が社長に就任（創業家以外から初）。杉村健三は会長に}
  - {date: "2022-04", event: カートグラフ株式会社を約85億円で買収し、株式会社ミナトヤ・デジタルを設立。東証プライム市場へ移行}
  - {date: "2023-04", event: 物流SaaS「MINATOYA Logi Cloud」の外販を開始}
  - {date: "2023-10", event: 浜松スマートDC（第1期、AMR180台）が稼働}
  - {date: "2024-03", event: ランサムウェア被害で清水DC・沼津DCの出荷が36時間停止（社内呼称「3.9」）}
  - {date: "2024-04", event: 共同配送「東海ルートシェア」を開始。基幹刷新「Project TIDE」を決裁。CISOを設置}
  - {date: "2024-06", event: 杉村健三が会長を退任し相談役に}
  - {date: "2024-10", event: データ基盤「MINATO Data Harbor」が稼働}
  - {date: "2025-04", event: 中期経営計画「MINATOYA NEXT 2028」を公表}
  - {date: "2025-06", event: 社内向け生成AI「みなとAI」を導入}
  - {date: "2025-09", event: TIDE第1フェーズ（会計・人事給与）が稼働}
  - {date: "2025-10", event: AI発注「シオミ」の実証を12店舗で開始}
  - {date: "2026-04", event: 物流統括管理者（CLO）に大河内剛を選任。AI利用ガイドラインv2を施行}
  - {date: "2026-09", event: TIDE第2フェーズの遅延を経営会議に正式報告（9月29日）}
  - {date: "2026-10", event: 中間決算発表（9日）、決算説明会（14日）、経営会議でシオミ30店拡大を条件付き承認（20日）}

