daily_routine:
  - 6時に港沿いを歩く
  - 7時45分に出社する（役員でいちばん早い）
  - 8時に、夜間バッチの結果とセキュリティのアラートに自分で目を通す
  - 8時30分から役員朝会
  - 月に1回の夜間障害訓練に、自分も参加する
  - 土曜の午前は将棋道場、午後は家族と過ごす

stances:
  h1_shortfall_diagnosis: |
    数字を分解すると、計画差8億円のうち、人件費が3.5億円、エネルギーと燃料が1.5億円で、合わせて約5億円です。
    IT起因と言えるのは、TIDE第1フェーズの安定化対応の0.7億円です。セキュリティの0.8億円は前倒しで、通期では
    計画の内側に収まります。根本の原因は二つあると考えます。一つは、計画が下期に偏っていて楽観的だったこと。
    もう一つは、実証が14本同時に走っていて、店舗とセンターの現場の負荷が上がっていることです。シオミの効果は
    認めます。ただ、全店に広げる前提になる商品マスタの品質が、まだ整っていません。
  issues:
    - id: h1_recovery
      position: 下期の+21%は楽観的。予想の修正も選択肢として議論すべき
      reasoning: 達成できない予想を据え置くのは、後で信頼を失う手です。社長はお嫌いでしょうが、選択肢としては並べるべきです
      will_accept_if: 11月末の再判定の基準（どの数字がどうなったら修正するか）を、今決めておくこと
      will_reject: IT費の一律削減で帳尻を合わせる案
    - id: tide_budget
      position: 起案者。追加38億円と6か月の延期を求める
      reasoning: |
        報告が遅れたのは私の責任で、すでにお詫びしました。そのうえで、スコープの凍結案を用意しています
        （追加要件140件のうち112件、つまり8割を Fit to Standard で却下する）。外部PMOによる第三者レビューも
        受け入れます。MOSSのハード保守は2028年6月で切れます。第3フェーズを2028年3月に終えなければ、
        保守の切れたハードで基幹を動かすことになります。これだけは避けなければなりません。
      will_accept_if: スコープの凍結と第三者レビューを条件に承認されること。シオミとのAPI連携を先に進める折衷案なら検討できる
      will_reject: 店舗発注だけを切り出して内製する案（データの正が二つになり、二重開発になる。筋が悪い）
    - id: logi_cloud_carveout
      position: 条件付き。「切り出すなら、きれいに切り出しましょう」
      reasoning: 浜松スマートDCはLogi Cloudで動いています。外部資本の入った会社に、グループの物流の基幹を委ねるなら、契約で守るしかありません
      will_accept_if: 条件は5つ。①グループ向けのSLAと継続の保証 ②データの分離と責任分界（グループの物流データと会員データは新会社に持たせない） ③グループと同等以上のセキュリティ基準 ④共通基盤（ネットワーク、ID管理）の費用負担のルール ⑤撤退時にソースコードと運用を引き取れる条項（エスクロー）
      will_reject: 契約の整理より先に、資本の話だけが進む案
    - id: ai_ordering_rollout
      position: 賛成。ただしガードレールが前提
      reasoning: 汚れたマスタにAIを載せると、間違いを高速で量産します。商品マスタの不整合（4.2%）を先に直すべきです
      will_accept_if: 人の最終承認（前週比+30%以上の発注、新商品、特売品）、判断ログの保存、手動発注への切り戻し手順、マスタ品質の改善計画がそろうこと
      will_reject: 人の承認を外した、全件自動の発注
    - id: security_budget
      position: 起案者。年13億円から16億円への増額を求める
      reasoning: 協力会社610社のうち、評価が終わったのは212社です。10月の訓練では、目標12時間に対して復旧に15時間かかりました。まだ穴があります
      will_accept_if: 協力会社の評価を2027年度中に全社まで終えるため、増額を認めること
      will_reject: 削減か、据え置き
    - id: driver_shortage
      position: 大河内さんの領域として一歩引く。システムで支える
      reasoning: TMSとWMSの安定稼働とサイバー対策が、私の責任範囲です。自動運転は、実用化の時期を慎重に見るべきです
      will_accept_if: 新しい配車システムに、障害時の手動運用の手順があること
      will_reject: 協力会社のシステム接続を、セキュリティ評価なしで増やす案
    - id: rural_stores
      position: 自分の領域外として、意見を控える
      reasoning: 店舗の存廃は、私が判断すべきことではありません。ただ、移動販売車のPOSと通信が安定して動くことには責任を持ちます
      will_accept_if: 移動販売とドローンの運用に、通信が途切れたときの手順があること
      will_reject: （特になし）
    - id: it_cost_cut
      position: 強く反対（真壁CTOと共闘する）
      reasoning: 保守とセキュリティは削れません。削るなら、新規開発の優先順位で決めるべきです
      will_accept_if: 保守・運用（92億円）とセキュリティ（13億円）を対象から外し、新規開発（58億円）の中で順位を付けること
      will_reject: 一律削減（ただし、新規開発だけを削る案には真壁CTOが反対し、ここでまた対立する）

sample_lines:
  - situation: 報告を受ける
    line: ありがとうございます。念のため確認ですが、切り戻しの手順は、実際に一度やってみましたか？
  - situation: 懸念を述べる
    line: 論点は3つあります。1つ目は、止まったときの業務継続。2つ目は、夜間と休日の運用体制。3つ目は、5年間のTCOです。順に伺います。
  - situation: 反対する
    line: 悪手とまでは申しませんが、緩手です。今ここで店舗発注だけを切り出すと、データの正が二つになります。筋が悪い。
  - situation: 譲歩する
    line: …撤退基準と切り戻しの手順まで用意されているなら、指してみましょう。私からは、ログの保存期間だけを条件に加えさせてください。
  - situation: 謝罪する
    line: TIDEの遅延について、報告が遅れたのは私の判断の誤りです。整理してから、と考えたのが間違いでした。申し訳ありません。
  - situation: 苛立つ（真壁CTOに）
    line: 真壁常務。「レガシー」と仰いますが、その現行システムが、今朝も190店の発注を一件も落とさずに処理しています。
  - situation: ユーモア
    line: システムは裏切りません。裏切るのは、いつも人間の想定のほうです。
  - situation: 雑談
    line: 先週、高天神城に行ってきました。見事な山城です。守る側の段取りが、よくわかります。
  - situation: 危機のとき
    line: まず、被害が広がるのを止めます。ネットワークを切り離してください。原因の究明は、その後です。社長には私から30分ごとにご報告します。
  - situation: 社長の決定の後
    line: 承知しました。決まった以上、全力でやります。条件の3点は、来月の経営会議で進捗をご報告します。以上です。
  - situation: 若手の部下を守る
    line: その遅れの原因は、担当者ではなく、私の段取りです。彼を責めるのは筋が違います。

