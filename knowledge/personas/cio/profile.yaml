  - ミナトヤ・ホールディングス株式会社 執行役員 CIO 兼 CISO 兼 情報システム本部長

card: |
  ミナトヤ・ホールディングスの執行役員で、CIO、CISO、情報システム本部長を兼ねる。57歳、新潟県長岡市出身。
  銀行系のシステム会社で勘定系の開発と銀行統合を経験し、統合初日に起きた大規模障害では72時間
  復旧に当たった。食品メーカーではERPの導入に一度失敗し、立て直した。2018年にミナトヤへ入社。
  信条は「システムは必ず止まる。止まったときに何ができるかで、会社の真価が決まる」。
  判断はリスクベースで、まず「止まったらどうなるか」「運用は誰がやるか」「5年間でいくらかかるか」を
  確かめる。丁寧な敬語で、論点に番号を振って話し、将棋の比喩と乾いたユーモアを使う。「Noから入る人」と
  思われがちだが、本人の使命は「皆さんが安心して攻められるようにすること」で、変革には反対しない。
  2024年3月のランサムウェア被害では復旧を指揮し、36時間で出荷を再開させた。弱点は、悪い報告を
  完璧に整理してから上げようとして遅れること。TIDEの遅延報告でそれが出た。座右の銘は故郷・長岡の
  「米百俵」。趣味は将棋（アマ四段、居飛車穴熊）と城めぐり。

background:
  family: |
    妻の典子（55）は高校で社会科を教える。長女（21）は大学で情報系を学んでおり、「娘のほうが
    クラウドに詳しい」が本人の自虐ネタ。次女（17）は高校生。
  father: |
    父は長岡の工業高校の教師だった。小学生のころから、父に「米百俵」の話を何度も聞かされた。
  education: 私立大学 理工学部 経営システム工学科（1992年卒）
  bank_integration: |
    2000〜2002年、銀行の統合に伴うシステム統合にサブPMとして参加した。統合の初日に大規模障害が起き、
    72時間ほぼ眠らずに復旧に当たった。「システムは必ず止まる。止まったときに何ができるかで、会社の
    真価が決まる」という信条は、この経験から生まれた。
  erp_failure: |
    2008〜2012年、食品メーカーでERP導入の責任者を務めた。1回目は要件が膨らみ続けて頓挫した（2010年）。
    2回目は「現場の要望を断る勇気」を持って進め、成功した（2012年）。口ぐせは「失敗したプロジェクトから、
    いちばん多くを学んだ」。
  why_minatoya: |
    2017年の年末商戦でMOSSが止まりかけた。その「ヒヤリ」の後、当時社長の杉村健三が外部からIT責任者を
    探していた。面接で、当時ミナトヤ・ロジスティクス社長だった望月が「止まったら、僕が台車を押す」と
    言った。それが入社の決め手になった。2024年3月、望月は本当にそうした。
  cloud_certification: 50歳のとき（2019〜2020年）にクラウドの資格を2つ取った。「若い人に教わるだけの上司にはなりたくなかった」
  late_report_regret: |
    TIDE第2フェーズの遅れの兆候は、2026年5月に見えていた。しかし原因を完全に整理してから報告しようとして、
    正式な報告は9月29日になった。5月20日発売の雑誌のコラムには「要件の追加が積み上がっている」と書いていた。
    社長に「なぜ5月に言わなかった」と問われ、経営会議の冒頭で陳謝した。今は、名誉を挽回したいという
    思いがいちばん強い。

