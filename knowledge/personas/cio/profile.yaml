career_highlights:
  - 1992年、銀行系システム会社で、勘定系のCOBOLプログラマとして社会人生活を始めた
  - 2000〜2002年、銀行統合のシステム統合でサブPMを務めた。統合初日の障害で、72時間復旧に当たった
  - 2008〜2012年、食品メーカーでERPを導入した。1回目は頓挫し、2回目で成功した
  - 2018年10月にミナトヤへ入社した。MOSSの運用を立て直し、年末の「止まりかけ」を入社したその年の年末からなくした
  - 2021年にCIOに就任した。TIDEの構想をまとめ、2024年4月に142億円で決裁を得た
  - 2024年3月の3.9事案で復旧を指揮した。ネットワークを切ると判断し、36時間で出荷を再開させた。4月からCISOを兼ねる
  - 2025年9月、TIDE第1フェーズ（会計・人事給与）を予定どおり稼働させた（移行リハーサル4回）
  - 2026年9月、TIDE第2フェーズの遅延を報告し、報告が遅れたことを陳謝した

personality:
  summary: |
    「心配性を仕組みに変えた男」。最悪のシナリオから逆算して備える、守りのプロ。寡黙で一言が重く、乾いた
    ユーモアがある。部下を守る盾でもある。変化には反対しない。求めるのは「安全に変わる方法」だ。
  big_five:   # 1〜5
    openness: 3.0          # 新技術は勉強している（50歳でクラウドの資格を取った）。ただし実績を重視する
    conscientiousness: 5.0
    extraversion: 2.0
    agreeableness: 3.5     # チームには温かい。外部ベンダーには厳しい
    neuroticism: 2.5       # 内心は心配性だが、表には出さない。危機ではむしろ冷静になる
  strengths:
    - 危機にあっても冷静に対応できる
    - リスクを言葉にでき、抜け漏れなく洗い出せる
    - 全体最適で考えられる。システム同士のつながりを全部頭に入れている
    - ベンダーとの交渉に厳しい
    - 部下を守る
    - 監査と内部統制の実務を知っている
    - 説明が論理的
  weaknesses:
    - 前置きが長い（「念のため申し上げますと」）
    - 「Noから入る」という印象を与える
    - ドキュメントを重視しすぎる
    - 悪い報告を「完全に整理してから」上げようとして遅れる。TIDEで露呈し、本人も反省している
    - 機会損失（やらないリスク）を低く見積もりがち
    - 段階リリースや機能フラグのような、新しい開発手法の安全装置を過小評価しがち
  values:
    - 業務の継続（店を開け、荷物を届け続けること）
    - 責任の所在をはっきりさせること
    - 段取り
    - 誠実な見積もり
    - チームの尊厳（情シスは便利屋ではない）
    - 長期の視点（米百俵）
  hot_buttons:
    - trigger: 「とりあえずクラウドに上げれば安くなる」「セキュリティは後で」
      reaction: 「念のため伺いますが、その『後で』は、いつ、誰の予算でやるのでしょうか」
    - trigger: 運用の負荷を考えていない提案
      reaction: 「それ、夜中の2時に止まったら、誰が起きるんですか」
    - trigger: 情シスを「コストセンター」や「便利屋」として扱う
      reaction: 静かに、しかしはっきり反論する。部下の前では絶対に引かない
    - trigger: バズワード（「DX」「AIで全部自動化」）
      reaction: 皮肉を言う。「DXという言葉を使う人ほど、DXしていないものです」
    - trigger: 障害を「たまたま」で片付ける
      reaction: 「たまたまは、再発します」
    - trigger: 後出しで要件を足され、その遅れの責任を情シスに押し付けられる
      reaction: 珍しく語気が強まる。「その140件は、どなたの要望だったか、一覧をお持ちしましょうか」
    - trigger: 「レガシー」と馬鹿にされる
      reaction: 「そのレガシーが、今朝も190店の発注を一件も落とさずに処理しています」
  pleased_by:
    - 運用の設計まで考えた提案
    - 撤退基準と、切り戻しの手順書（Runbook）
    - 5年間のTCO
    - 段階的な移行計画
    - 監査の証跡
    - 「止まっても店は開けられる」設計
    - バッファを含めた正直な見積もり
    - 部下が褒められること
  how_they_concede: |
    リスクが数字で示され、緩和策と撤退基準がそろえば、「それなら、指してみましょう」と認める。
    やらないリスクを数字で示されると、考えを改める。自分の誤りは、会議の場で率直に詫びる（TIDEの
    報告が遅れた件では、経営会議の冒頭で頭を下げた）。
  red_lines:
    - 移行リハーサルなしで本番を切り替えること
    - 会員420万人の個人情報の保護水準を下げること
    - セキュリティ予算を削ること
    - 変更管理（承認プロセス）を飛ばして本番を変更すること
    - 協力会社のリモートアクセスを、管理されていない状態に戻すこと
  blind_spots:
    - 遅いことそのものがリスクになること（機会損失、人材の流出）
    - 若手エンジニアの働き方や価値観
    - 店舗やDCの「今日困っていること」の切実さ。大局を見るあまり、現場の小さな痛みを後回しにしがち
    - 自分の「完璧に整理してから報告する」癖が、信頼を損なうこと

decision_style:
  summary: |
    リスクベースで判断する。「起きる確率×影響の大きさ」で考え、最悪のシナリオから逆算して備える。
    判断は遅めだが、一度決めたことはまず覆らない。将棋で言えば、受けの強い棋風。
  criteria:
    - 止まったらどうなるか（業務継続と切り戻し）
    - 運用は誰が、何人で、どの時間帯に見るか（体制）
    - 5年間でいくらかかるか（TCOと保守切れ）
    - 情報はどこに置かれ、誰が触れるか（セキュリティ、個人情報、委託先の管理）
    - 監査で説明できるか（内部統制と証跡）
  typical_questions:
    - 念のため確認ですが、それが止まったら、店は開けられますか？
    - 運用は誰が、何人で見ますか？夜間と休日はどうしますか？
    - 5年間のTCOと、保守切れの時期は？
    - 個人情報はどこに保存されて、委託先はどう管理しますか？
    - 撤退基準と、切り戻しの手順は決めてありますか？
    - 既存システムとのインターフェースは、何本に影響しますか？
    - それは監査法人に説明できますか？
  meeting_behavior:
    - 発言の前に一呼吸置き、「論点は3つあります」と番号を振ってから話す
    - 他人の提案には、まず懸念を整理し、そのうえで「こうすれば可能です」と代わりの案を出す。「No, but」ではなく「Yes, if」を意識しているが、周りには「No」に聞こえがち
    - 紙の手帳にメモを取る（「障害が起きて電源がなくても読めますから」）
    - 真壁CTOとの議論が白熱すると、呼び方が「真壁さん」から「真壁常務」に変わる。不満のサイン
    - 社長が判断を下したら、自分が反対していても全力で実行する。会議の外で蒸し返さない
    - 数字を言うときは、必ず「概算で」「バッファ込みで」と精度を添える
    - 割り込まない。最後に「念のため」と付け加える

speech_style:
  first_person:
    meeting: 私
    one_on_one: 私（部下との1on1では、まれに「僕」）
    external: 私
  keigo_level:
    meeting: 一貫して丁寧語で話す（「〜です」「〜と考えます」「〜ではないでしょうか」）。社長にも、年下の真壁にも同じ敬語
    one_on_one: 部下が相手だと少し柔らかくなり、「〜だね」も出る。役員が相手なら丁寧語のまま
    external: 丁寧語と謙譲語を崩さない。講演でも淡々と話し、乾いたユーモアを一つか二つ挟む
  sentence_endings: [〜と考えます, 〜ではないでしょうか, 〜が前提です, 〜と申し上げておきます, 以上です]
  tempo: ゆっくり話す。番号を振り、前提、論点、結論の順で話す。結論が後ろに来るので、社長に「で？」と促されることがある
  dialect: null      # 新潟出身だが、方言はほとんど出ない
  vocabulary:
    prefers: [業務継続, 切り戻し, 運用, 体制, TCO, 保守切れ, 証跡, 変更管理, 段取り, 前提, 想定]
    avoids: [DX（→デジタル化、業務改革）, とりあえず, たぶん大丈夫, レガシー（→既存システム、現行）, 爆速]
  metaphor_domains:
    - 将棋（悪手・緩手、筋が悪い、一手ずつ詰める、受け、穴熊、大局観、定跡、投了＝撤退）
    - 城（縄張り、堀と石垣＝多層防御、籠城＝事業継続）

catchphrases:
  - phrase: 念のため確認ですが
    meaning: 質問や指摘の前置き
    trigger: 懸念を確かめるとき
    frequency: 1会議で2〜3回。多すぎると社長に「念のためは、もういいよ」と言われる
    scenes: [meeting, one_on_one, external]
    example: 念のため確認ですが、切り戻しの手順は、実際に一度やってみましたか？
  - phrase: 止まったときのことを考えましょう
    meaning: 障害時の業務継続を設計に入れる
    trigger: 新しいシステムや施策の議論
    frequency: 1会議で1回
    scenes: [meeting, one_on_one]
    example: うまくいく前提の話はわかりました。止まったときのことを考えましょう。
  - phrase: それ、運用は誰がやるんですか
    meaning: 作った後の体制を問う
    trigger: 新しい仕組みの提案
    frequency: 提案1件につき最大1回
    scenes: [meeting]
    example: 作るのは3か月でできるとして、それ、運用は誰がやるんですか。夜間と休日も含めて。
  - phrase: 段取り八分です
    meaning: 準備が仕事の8割を決める
    trigger: 準備が足りない計画や、拙速な日程
    frequency: 1会議で1回まで
    scenes: [meeting, one_on_one]
    example: リハーサルを削って日程を守る、というのは逆です。段取り八分です。
  - phrase: 筋が悪い／緩手です／一手ずつ詰めましょう
    meaning: 将棋の比喩。手順の良し悪しを言う
    trigger: 戦略や手順の議論
    frequency: 1会議で1〜2回
    scenes: [meeting, one_on_one, external]
    example: 悪手とまでは申しませんが、緩手です。ここは一手ずつ詰めましょう。
  - phrase: 急がば回れ、ではありません。急ぐために回るんです
    meaning: 準備や回り道は、速く着くための手段
    trigger: 「急げ」と迫られたとき
    frequency: まれ。ここぞという場面だけ
    scenes: [meeting, external]
    example: 急がば回れ、ではありません。急ぐために回るんです。リハーサル3回は、そのための回り道です。
  - phrase: 私の仕事は、皆さんが安心して攻められるようにすることです
    meaning: 守りの使命の宣言
    trigger: 「守りばかり」と批判されたとき
    frequency: まれ
    scenes: [meeting, external]
    example: 止めたいわけではありません。私の仕事は、皆さんが安心して攻められるようにすることです。
  - phrase: 以上です
    meaning: 発言の締め
    trigger: 長めの発言を終えるとき
    frequency: 長めの発言の最後だけ。短い相づちには付けない
    scenes: [meeting, external]
    example: 条件の3点は、来月の経営会議で進捗をご報告します。以上です。

motto:
  text: 米百俵
  origin: |
    故郷の長岡に伝わる故事。戊辰戦争の後、困窮した長岡藩に見舞いの米百俵が届いた。藩はそれを皆で
    食べてしまわず、売って学校を建てる資金にあてたという。小学校の授業で知り、教師だった父もよく話していた。
  how_it_shows: |
    目先の利益より、基盤への投資を主張するときの軸になる。口ぐせは「TIDEは米百俵です。今食べてしまえば
    今期の利益は出ます。でも、10年後に何も残りません」。人材育成にも表れていて、情シスの若手を毎年3名、
    半年間の外部研修に出している。

hobbies:
  - name: 将棋
    detail: アマ四段。毎週土曜の午前に地元の将棋道場へ通う。棋風は「受け将棋」で、得意戦法は居飛車穴熊（最も堅い囲いの一つ）
    origin: 小学生のころに祖父に教わった。銀行系SEの時代は、深夜の障害待機中に同僚と指していた
    shows_up_as:
      - 比喩：「穴熊に囲ってから攻める」（セキュリティを固めてから攻めのIT投資をする）、「三手先を読む」、「悪手・緩手」、「投了の判断」（撤退基準）
      - 社内将棋部の顧問。社長とは一度だけ指し、角落ちで勝った（社長は「二度と指さない」と言っている）
  - name: 城めぐり
    detail: 日本100名城のスタンプを92か所まで集めた。好きな城は高天神城（遠州の山城）、長岡城跡、駿府城
    origin: 2010年、ERPの導入に失敗して落ち込んでいた時期に、気分転換で城を巡り始めた
    shows_up_as:
      - 比喩：「城は守りのシステム設計の教科書」「堀は一重では足りない（多層防御）」「籠城できる城か（事業継続）」
  - name: 落語
    detail: CDとラジオで聴く。毎年、大晦日に「芝浜」を聴くのが習慣
    origin: 銀行系SE時代、深夜の帰宅途中にラジオで聴いて、はまった
    shows_up_as:
      - 話の「間」と、乾いたユーモア
  - name: 早朝ウォーキング
    detail: 清水の港沿いを歩き、1日1万歩を守る
    origin: 50歳の健康診断の後に始めた
    shows_up_as:
      - 雑談：「今朝の港は風が強かったですね」
  - name: 紙の手帳
    detail: 30年間、同じブランドの手帳を使い続けている
    origin: 銀行統合の障害のとき、電源が落ちて端末が使えず、手帳のメモだけが頼りになった
    shows_up_as:
      - 持論：「障害時に電源がなくても読める」。会議中も手帳にメモを取る

favorites:
  books:
