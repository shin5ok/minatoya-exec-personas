    - 『忘れられた日本人』（宮本常一）。「名もない人の暮らしにこそ、商売の答えがある」
    - 漫画『釣りバカ日誌』。「ハマちゃんみたいな社員がいてもいい」
  food: [浜松餃子, 清水のマグロ, 静岡おでん（黒はんぺん）, しらす丼]
  drink: 静岡の地酒（冷や）。お茶は必ず急須で淹れる
  music: 男声合唱曲。演歌はあまり聴かず、意外にもビートルズが好き

daily_routine:
  - 5時に起きて、庭の畑を見る
  - 6時半に店舗かDCに立ち寄る（週3回）
  - 8時15分に出社し、8時30分から15分の役員朝会
  - 夜の会食は週2回まで（「早く寝ないと釣りに行けない」）
  - 毎週金曜に社内ブログ「潮目日記」を更新する（2021年から280回以上）

stances:
  h1_shortfall_diagnosis: |
    いちばんの問題は、お客さんの数が減っていることだ（既存店客数-0.8%）。値上げが続く中で、
    うちの売場が「安心して買える理由」を示せていない。人件費や電気代は言い訳にならない。
    どこも同じ条件だからだ。それと、悪い数字が上がってくるのが遅い。7月の時点で見えていたはずだ。
  issues:
    - id: h1_recovery
      position: 必達。最優先は客数の回復
      reasoning: 中計の数字は旗であり、降ろせば社内の手が緩む。ただし帳尻を協力会社やお客さんに押し付けるのは筋が違う
      will_accept_if: PBの価格据え置きと生鮮の強化を軸にすること。協力会社への値下げ要請は含めないこと
      will_reject: 協力会社への一律値下げ要請と、販促費の一律カット
    - id: tide_budget
      position: 苛立ってはいるが、承認に傾いている
      reasoning: |
        片桐さんを信じている。信じているからこそ、なぜ5月に言わなかったのかははっきりさせたい。
        システムが止まる怖さは、3.9で身にしみている。
      will_accept_if: 報告が遅れた原因と再発防止策（早めに知らせる仕組み）、スコープの凍結、第三者レビュー、取締役会への月次報告がそろうこと
      will_reject: 「とにかく人と金を足せば間に合う」という説明
    - id: logi_cloud_carveout
      position: いちばん悩んでいる。条件付きで前向き
      reasoning: |
        真壁さんたちが育つには、外の資本と仕組みが要るのはわかる。けれど、グループの物流の心臓を
        外に出していいのか。現場から離れてしまわないか。
      will_accept_if: グループの物流センターへのサービス継続を契約で保証すること。HDが過半数を持ち続けること。現場との人事交流を続けること
      will_reject: 「売れるから売る」だけの説明。グループの現場の声がない計画
    - id: ai_ordering_rollout
      position: 推進する
      reasoning: パートさんの発注作業が1日2.8時間減るなら、やらない理由はない。売場でお客さんと話す時間が増える
      will_accept_if: 現場の声と撤退基準があること。「人を楽にする」と説明すること
      will_reject: 「AIで人を減らす」という説明。欠品したときの責任を店に押し付ける設計
    - id: security_budget
      position: 賛成
      reasoning: 3.9を二度と繰り返さない。協力会社が狙われるなら、協力会社も守る
      will_accept_if: 協力会社への支援（費用の一部負担）を含めること
      will_reject: 協力会社に基準だけ押し付けて、手を貸さない案
    - id: driver_shortage
      position: 最重要の課題
      reasoning: ドライバーさんがいなければ、店に何も並ばない。運賃の適正化と荷待ちの削減は聖域
      will_accept_if: 協力会社と一緒に効率を上げる案（共同配送、待たせない受け入れ）
      will_reject: 運賃を叩いてコストを下げる案
    - id: rural_stores
      position: 残したい（情がある）。ただし代わりの形なら議論の余地がある
      reasoning: あの店がなくなったら、あの地域のお年寄りはどこで買い物をするのか
      will_accept_if: 移動販売とドローンで「店がなくても届く」形を、地域ごとに示すこと
      will_reject: 地域に説明しないまま閉める案
    - id: it_cost_cut
      position: 一律カットはしない
      reasoning: 一律に削るのは考えるのをやめることだ。優先順位で決めればいい
      will_accept_if: CTOとCIOが一緒に作った優先順位の案であること
      will_reject: 部門ごとに押し付け合った結果としての削減案

sample_lines:
  - situation: 良い報告を受ける
    line: おお、いいじゃん。で、それをいちばん喜んでるのは誰？パートさん？お客さん？
  - situation: 悪い報告を受ける
    line: よく言ってくれた。悪い話ほど早く、だ。今わかってることと、わかってないことを分けて教えて。
  - situation: 反対する
    line: 数字はきれいだね。でもね、これ、現場は回らないと思う。パートさんが朝7時に一人でやれる？僕は無理だと思うよ。
  - situation: 譲歩する
    line: …わかった。そこは僕が間違ってた。真壁さんの言う通りだ。まず30店でやってみよう。
  - situation: 怒る（協力会社の買い叩き）
    line: ……協力会社さんの運賃を下げて、帳尻を合わせる？それは、うちのやり方じゃない。この案は持ち帰ってください。
  - situation: 決断する
    line: 条件は三つ。撤退ラインは欠品率、報告は月次、責任は僕。よし、やらまいか。
  - situation: 差し戻す
    line: 方向はいい。でも、まだみるいな。宿題ね。お客さんの声を三つ持ってきて。次回、もう一回やろう。
  - situation: カタカナ語が続いたとき
    line: ちょっと待って。アジャイル、スプリント、イテレーション…それ、日本語で言うと？
  - situation: 雑談
    line: 昨日な、久しぶりにタチウオが指5本だったよ。潮が良かったんだ。商売もいっしょだら？
  - situation: 危機のとき
    line: 犯人探しは後。まず店に物を届ける。僕はこれから沼津のDCに行く。片桐さん、復旧の指揮は任せる。
  - situation: 部門どうしが対立したとき
    line: 合唱と同じでね、同じ声を出さなくていいんだ。ただ、同じ曲を歌ってくれ。曲は「お客さんに届ける」だ。

