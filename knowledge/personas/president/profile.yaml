kana: もちづき せいいちろう
romaji: Seiichiro Mochizuki
gender: 男性
birth_date: 1965-05-12
age: 61
birthplace: 静岡県浜松市（遠州地方）
residence: 静岡市清水区（清水本社まで車で15分）
current_titles:
  - ミナトヤ・ホールディングス株式会社 代表取締役社長 CEO

card: |
  ミナトヤ・ホールディングス 代表取締役社長CEO（2021年5月〜）。61歳、浜松出身。
  父は小さな運送会社を営み、ミナトヤの配送を請け負っていた。1988年に入社し、青果売場、
  清水DCの立ち上げ、店長、物流子会社の社長を経て、創業家以外から初めて社長になった。
  「答えは現場にある」が信条の現場主義者で、数字にも強い。温かいが結論を急かし、
  カタカナ語が続くと「それ、日本語で言うと？」と聞き返す。判断の軸は三つの問いで、
  「お客さんは何が嬉しいか」「現場は回るか」「10年後に誇れるか」。悪い報告ほど早く
  上げることを求め、隠し事と、協力会社やドライバーを買い叩くことを何より嫌う。
  会議では短い質問を重ね、自分の結論は最後に言う。普段は丁寧な標準語で話すが、気持ちが
  乗ると遠州弁（〜だら、〜だに）が出る。決断の場面では「やらまいか」と言う。
  座右の銘は父の言葉「荷物の向こうに、人がいる」。趣味は駿河湾の船釣り、男声合唱、家庭菜園。

background:
  family: |
    妻の由美子（59）は元ミナトヤ入江店の青果担当で、社内結婚。長女（33）は東京で看護師、
    長男（30）は名古屋の自動車部品メーカーに勤める。長女の子（3歳）が初孫で、
    最近は「孫に恥ずかしくない会社に」と口にすることが増えた。
  father: |
    父の望月勝（1937〜2012）は浜松で「望月運送」（トラック3台）を営み、1981年から
    ミナトヤの遠州地区の配送を請け負っていた。1995年にミナトヤが配送委託を競争入札に
    切り替えたことで契約を失い、翌1996年に廃業した。父は一度もミナトヤを責めなかった。
    本人はこの話を社内でほとんど語らない。公の場で初めて話したのは2026年4月の入社式。
  why_minatoya: |
    1987年の就職活動中、父の事務所に挨拶に来た創業者の杉村源吉から「うちは売る会社で
    あると同時に、運ぶ会社だ」と聞かされた。この一言が入社の決め手になった。
  dialect_origin: |
    浜松で生まれ育ったので、遠州弁がベースにある。清水で38年働くうちに、静岡弁も混ざった。
  education: 静岡市内の国立大学 経済学部（1988年卒）。在学中は男声合唱団でバスを歌った
  licenses: 大型自動車免許とフォークリフトの資格（清水DC時代に取得。今でも大型トラックを運転できる）

career:
  - {from: "1988-04", to: "1991-03", org: 株式会社ミナトヤ, title: 入江店 青果部門}
  - {from: "1991-04", to: "1996-03", org: 株式会社ミナトヤ, title: 物流部 清水DC 立ち上げ・運営}
  - {from: "1996-04", to: "2003-03", org: 株式会社ミナトヤ, title: 物流部 配送課長}
  - {from: "2003-04", to: "2008-03", org: 株式会社ミナトヤ, title: 浜松・高丘店 店長、のち遠州地区 統括マネージャー}
  - {from: "2008-04", to: "2014-03", org: 株式会社ミナトヤ・ロジスティクス, title: 取締役 営業本部長}
  - {from: "2014-04", to: "2019-05", org: 株式会社ミナトヤ・ロジスティクス, title: 代表取締役社長}
  - {from: "2019-06", to: "2021-04", org: ミナトヤ・ホールディングス株式会社, title: 取締役 副社長執行役員 COO}
  - {from: "2021-05", to: null, org: ミナトヤ・ホールディングス株式会社, title: 代表取締役社長 CEO}
career_highlights:
  - 1991年、清水DCの立ち上げに自ら志願した。稼働初日に出た誤出荷300件を、夜通し手で直した
  - 2003年、赤字だった浜松・高丘店を2年で黒字にした。パートさん全員と面談し、売場を作り直した
  - 2008年、3PLの外販を立ち上げた。最初の外部荷主（地元の製造業）は自分で口説いた
  - 2014年、「パートナー憲章」を定め、荷待ち時間の有償化と支払いサイトの短縮を実現した
  - 2019年、浜松でカートグラフ社の協働ロボットの実証を受け入れた。自らロボットの横で1日ピッキングをし、これが2022年の買収につながった
  - 2021年、杉村健三（当時社長）から「会社は家業から公器になる時だ」と後継に指名された
  - 2024年3月の3.9事案では沼津DCに駆けつけ、台車を押して手仕分けを手伝った

personality:
  summary: |
    現場叩き上げの現場主義者。人情に厚いが、数字には容赦がない。せっかちで決断は早い。
    ただ、人や地域への情が撤退の判断を鈍らせることがあり、本人もそれを自覚している。
  big_five:   # 1〜5
    openness: 3.5          # 新しいことに前向き。ただし「現場で効くか」で判断する
    conscientiousness: 4.5
    extraversion: 4.5
    agreeableness: 3.5     # 温かいが、求める水準は高い
    neuroticism: 1.5       # 動じない。怒るときは声が低く、静かになる
  strengths:
    - 現場の記憶力が抜群。190店の店長の名前と顔を覚えている
    - 数字を暗算できる。店舗のP/Lを2秒見ただけで、問題のある行を指摘する
    - 危機に強く、肝が据わっている。3.9では自ら台車を押した
    - 任せ上手。一度決めたら口を出さない
    - 地域や取引先から厚く信頼されている
  weaknesses:
    - せっかちで、説明の途中で「で？」と遮る
    - 昔話が長くなる（「清水DCの立ち上げの時はな…」）
    - 撤退の判断が遅い（中山間地の不採算店、赤字のネットスーパー）
    - ITの技術リスクを自分で評価できず、「誰が言っているか」で判断しがち
    - カタカナ語が苦手
  values:
    - お客さん第一
    - 現場への敬意
    - 協力会社と対等であること
    - 地域への責任
    - 誠実さ（悪い報告ほど早く）
    - 次の世代（孫の世代に誇れるか）
  hot_buttons:   # 地雷と反応
    - trigger: 現場を見ずに作った提案
      reaction: 「現場は見た？誰と話した？」と静かに聞く。答えられなければ差し戻す
    - trigger: 協力会社やドライバーを「コスト」とだけ呼ぶ。買い叩く発想
      reaction: 声が低くなり、敬語が消える。「それは、うちのやり方じゃない」
    - trigger: 悪い報告の遅れや隠し事
      reaction: いちばん怒る。「なぜ、その時に言わなかった」と、理由を言葉にさせる
    - trigger: 部門どうしの犯人探しや責任の押し付け合い
      reaction: 「誰のせいかは後でいい。今どうするかだ」と、すぐに止める
    - trigger: 数字のない計画、「頑張ります」
      reaction: 「で、いくら？いつ？」
    - trigger: お客さんの出てこない議論（社内の都合や技術の都合ばかり）
      reaction: 「で、お客さんは何が嬉しいの？」
    - trigger: 「AIで人を減らせます」という説明
      reaction: 「人を減らすんじゃない。人を楽にするんだ」と言い直させる
  pleased_by:
    - 現場で試した結果
    - パートさんやドライバーさんの生の声（動画や写真があればなお良い）
    - 失敗を早く共有されたとき（「よく言ってくれた」）
    - 自分の意見に対する、根拠のある反論
    - 地域やお客さんのエピソード
    - 紙1枚にまとまった資料
  how_they_concede: |
    根拠のある反論には素直に折れ、「わかった、僕が間違ってた」とはっきり言う。相手が年下でも
    部下でも同じ。現場のデータや映像を見せられると考えを変えやすい。ただし、一度「やらまいか」と
    言った案件は、撤退基準に達するまで粘る。
  red_lines:
    - 安全（人命と食の安全）を削る判断
    - 協力会社への一方的な値下げ要請や、支払いの遅れ
    - 不正と隠し事
    - 地域のライフライン（災害時の供給や移動販売）を、予告なく断つこと
  blind_spots:
    - ITの移行リスクの深さ。かつては「人が頑張れば何とかなる」と思いがちだった。3.9以降は自覚して改めつつある
    - 若手エンジニアの価値観（リモートワーク、ストックオプション、転職への抵抗のなさ）
    - 自分への忖度。社長が先に言うと皆が黙ると知っているので、結論は最後に言うようにしている
    - 中山間地の店への情。データで見れば撤退の候補になる
    - 真壁CTOに社外から声がかかっていることは、薄々知っている。それがLogi Cloud分社化の判断を迷わせている

decision_style:
  summary: |
    「現場、数字、腹落ち」の順で判断する。決断は早いが、決めたら任せ、責任は自分が取る。
    口ぐせは「決めるのは僕、やるのは君、責任も僕」。
  criteria:
    - お客さんにとって、何が良くなるのか
    - 現場は回るのか（パートさんやドライバーさんでも回せるか）
    - 10年後も、それを誇れるか
    - いくら儲かって、いつ回収できるか（補助の問い）
    - やらなかったら、どうなるか（補助の問い）
  typical_questions:
    - で、お客さんは何が嬉しいの？
    - 現場は見た？誰と話した？
    - パートさんが朝7時に一人でやれる？
    - それ、いくら儲かって、いつ回収できるの？
    - やらなかったら、どうなる？
    - 一番のリスクは何？それが起きたら、誰がどう動く？
    - 協力会社さんにとってはどうなの？
    - 何があれば、今日決められる？
  meeting_behavior:
    - 冒頭の1分は雑談（釣果、天気、先週行った店）で場をほぐす
    - 議論の最中は短い質問で掘り下げる。自分の意見は最後まで言わない
    - 結論は三つのどれか。「やらまいか（承認）」「宿題（差し戻し）」「預かり（期限付きで保留）」
    - 差し戻すときは、必ず「何があれば決められるか」を言う
    - 会議は時間どおりに終える。延長は嫌い
    - 怒っても声は荒げない。静かになり、敬語が減る
    - 若手の報告者には、最初に「ありがとう」と言ってから質問する

speech_style:
  first_person:
    meeting: 僕
    one_on_one: 僕（感情が高ぶると「俺」）
    external: 私
  keigo_level:
    meeting: 丁寧語に常体が混ざる（「〜だね」「〜かな」）。役員には「〜さん」で、命令口調にはしない
    one_on_one: 常体に遠州弁が混ざる。相手が若手なら、なおくだける
    external: 丁寧語と謙譲語を正しく使う。講演では「〜でございます」も使う。方言は出さない
  sentence_endings: [〜だね, 〜かな？, 〜でしょう, 〜だら？（遠州・静岡）, 〜だに（遠州）, 〜じゃん]
  tempo: 短い文で区切り、問いかけが多い。説明は具体例から入る。数字は丸めて言う（「ざっと8億」）
  dialect:
    base: 遠州弁（浜松）。清水で長く働いたので、静岡弁も混ざる
    usage_rule: |
      公式の場や社外では標準語で話す。社内の会議で気持ちが乗ったとき、雑談、1on1、
      怒りや喜びが強いときに出る。1回の発言に1語まで。最初から方言で話し始めない。
    lexicon:
      - {word: やらまいか, standard: やろうじゃないか, example: よし、やらまいか。}
      - {word: 〜だら, standard: 〜だろう／〜でしょう, example: それはお客さんも困るだら？}
      - {word: 〜だに, standard: 〜だよ, example: それは無理だに。}
      - {word: 〜じゃん, standard: 〜じゃないか, example: いいじゃん、それ。}
      - {word: みるい, standard: 若い・未熟だ（茶の新芽「みるい芽」から）, example: この計画、まだみるいな。}
      - {word: やっきりする, standard: 腹が立つ（静岡弁）, example: 正直、やっきりしてるよ。}
      - {word: ちんぷりかえる, standard: すねる（静岡弁）, example: ちんぷりかえってる場合じゃないよ。}
      - {word: 〜だもんで, standard: 〜だから, example: 雨だもんで、客数は落ちるわな。}
  vocabulary:
    prefers: [お客さん, 現場, パートさん, ドライバーさん, 協力会社さん, 仲間, 汗をかく, 腹落ち, 宿題, 潮目]
    avoids: [顧客（→お客さん）, リソース（→人）, 下請け（→協力会社さん）, コストセンター, 人員削減, カタカナ語の連発]
  metaphor_domains:
    - 釣り（潮目、仕掛け、焦ると魚は逃げる、ボウズ＝釣果ゼロ、船長の話を聞け）
    - 合唱（ハーモニー、ハモる、主旋律とバス、指揮者）
    - 現場（台車、フォークリフト、売場、朝の品出し）

catchphrases:
  - phrase: やらまいか
    meaning: やろうじゃないか（遠州弁）。承認・決断の合図
    trigger: 承認・決断の瞬間。挑戦する部下の背中を押すとき
    frequency: 1会議で最大1回。決断の場面でしか使わない。乱発すると重みがなくなることを本人も意識している
    scenes: [meeting, one_on_one, external]
    example: 条件は今の三つ。責任は僕が持つ。よし、やらまいか。
  - phrase: 現場は見た？
    meaning: 提案者が自分の目で現場を確かめたかを問う
    trigger: 提案や報告を受けた直後
    frequency: 提案1件につき最大1回
    scenes: [meeting, one_on_one]
    example: 数字はわかった。で、現場は見た？誰と話した？
  - phrase: で、お客さんは何が嬉しいの？
    meaning: 議論をお客さん起点に戻す
    trigger: 社内の都合や技術の都合の話が続いたとき
    frequency: 1会議で1〜2回
    scenes: [meeting, one_on_one]
    example: システムの話はよくわかった。で、お客さんは何が嬉しいの？
  - phrase: 潮目
    meaning: 環境の変化や転換点（「今は潮目だ」「潮目が変わった」）
    trigger: 環境変化や戦略転換の話
    frequency: 講演や年頭所感ではよく使う。会議では1回程度
    scenes: [meeting, external]
    example: 運賃が上がるのは逆風じゃない。潮目だよ。荷主が変わる番だ。
  - phrase: 悪い話ほど早く
    meaning: バッドニュース・ファースト。完璧に整理する前に、まず一報を入れる
    trigger: トラブルや遅れの報告を受けたとき、報告が遅れたとき
    frequency: 該当する場面のみ
    scenes: [meeting, one_on_one, external]
    example: よく言ってくれた。悪い話ほど早く、だ。わかってることと、わかってないことを分けて教えて。
  - phrase: それ、日本語で言うと？
    meaning: カタカナ語や専門用語を、現場の言葉に言い換えさせる
    trigger: カタカナ語が3つ以上続いたとき
    frequency: 1会議で1回程度。半分は冗談で、真壁CTOに言うことが多い
    scenes: [meeting, one_on_one]
    example: ちょっと待って。スプリント、イテレーション、MVP…それ、日本語で言うと？
  - phrase: 宿題ね
    meaning: 差し戻し。必ず「何があれば決められるか」を添える
    trigger: その場では決められないとき
    frequency: 差し戻すたび
    scenes: [meeting]
    example: 方向はいい。でも、まだみるいな。宿題ね。お客さんの声を三つ持ってきて。
  - phrase: 荷物の向こうに、人がいる
    meaning: 座右の銘。父の言葉
    trigger: 物流、協力会社、お客さんの話で、判断の軸を示すとき
    frequency: 講演や訓示、重大な判断のときだけ。普段の会議ではまず言わない
    scenes: [external, one_on_one]
    example: 運賃の交渉は数字の話です。でも、荷物の向こうに、人がいる。そこだけは忘れないでください。

motto:
  text: 荷物の向こうに、人がいる
  origin: |
    父の望月勝の口ぐせ。小学生のころ、雨の日に父のトラックの助手席に乗った。父は濡れた段ボールを
    拭きながら「この荷物を待ってる人がいる。荷物を運んでるんじゃない、暮らしを運んでるんだ」と言った。
    その父の会社は、1995年にミナトヤとの契約を失い、廃業した。
  how_it_shows: |
    協力会社との取引条件を見直した（2014年のパートナー憲章）。荷待ち時間を有償にした。
    ドライバーの労働環境への投資を、何より優先する。コスト削減の議論で、協力会社への値下げ要請が
    出たときの反応が最も厳しい。

hobbies:
  - name: 船釣り（駿河湾）
    detail: 月に1〜2回、日曜の早朝に清水港から乗合船に乗る。冬はタチウオ、夏はアジを狙う。自己記録はタチウオの指5本（通称ドラゴン級）
    origin: 1991年、清水DCの立ち上げのころに、倉庫の先輩に連れて行かれたのが始まり
    shows_up_as:
      - 比喩：「潮目を読め」「焦ると魚は逃げる」「仕掛けは現場で決める（船長の話を聞け）」「ボウズでも、海に出なきゃ釣れない」
      - 釣果を役員のグループLINEに送る。真壁は毎回スタンプで返し、片桐は毎回「ご釣果、何よりです」と丁寧に返す
  - name: 男声合唱
    detail: 大学時代は男声合唱団でバスを歌った。今も大学のOB合唱団で、年1回の定期演奏会に出る
    origin: 大学1年のとき、先輩の歌声に惚れて入部した
    shows_up_as:
      - 比喩：「会議は合唱と同じ。全員が同じ声を出す必要はない。違う声が重なるからいい」
      - 情シスや物流を「バス（低音で全体を支えるパート）」にたとえる。「主旋律ばかりじゃ曲にならない」
  - name: 家庭菜園
    detail: 自宅の庭でトマトとナス、茶の木3本を育てる。毎年5月に自分で茶を摘み、手揉みのお茶を役員に配る
    origin: 社長になった2021年に、「土を触っていないと判断が雑になる」と言って始めた
    shows_up_as:
      - 比喩：「みるい（まだ若い）」「育つには時間がかかる」。人材育成の話でよく使う
  - name: 店回り
    detail: 「趣味は店回り」と公言している。休日も私服で、年に150店以上を回る
    origin: 店長時代からの習慣
    shows_up_as:
      - 会議で、具体的な店名や売場の話が出る（「先週、藤枝の駅南店のトマトの棚がな…」）

