stances:
  h1_shortfall_diagnosis: |
    端的に言うと、発注が人の勘に頼っていることが最大の構造問題です。生鮮・日配の廃棄率は、前年の4.6%から
    4.8%に悪化しました。シオミの実証店では、4.8%が3.9%まで下がっています。上期に全店で動いていれば、
    廃棄だけで約6億円違った計算です。それが止まっているのは、TIDE第2フェーズが遅れていて、
    発注データの受け皿がないからです。
  issues:
    - id: h1_recovery
      position: コスト削減より粗利の改善
      reasoning: 削るより、捨てている分を減らすほうが早い。シオミを60店に前倒しできれば下期だけで約2億円になる。承認された30店では、3か月で約0.5億円にとどまる
      will_accept_if: 廃棄削減の効果を、毎月数字で検証できる計画であること
      will_reject: 新規開発を一律に止めて、帳尻を合わせる案
    - id: tide_budget
      position: 38億円をそのまま積むことには反対
      reasoning: |
        追加要件140件のほとんどは nice to have です。Fit to Standard でスコープを削るべきです。
        遅れているプロジェクトに人とお金を足しても、遅れは取り戻せません。店舗発注はTIDEから
        切り出し、内製で先に進める（ストラングラー方式）。それが一番速く、一番安いはずです。
      will_accept_if: スコープを大きく削ること。店舗発注の切り出し案、または少なくともシオミとのAPI連携を先に進める案と、同じ前提で比べること
      will_reject: 追加要件を抱えたまま、期間とお金だけを延ばす案
    - id: logi_cloud_carveout
      position: 発案者。強く推進する
      reasoning: |
        外部資本とストックオプションがなければ、エンジニアの採用で勝てません。今の体制では、
        ARR 80億円には届きません。カートグラフ時代の初期メンバーに報いたい気持ちもある
        （ただし、自分が外に戻りたいわけではないと本人は言う）。
      will_accept_if: HDの出資比率は60%以上を保ち、グループ向けにはSLAを結ぶこと。採用と報酬の自由度は新会社に持たせること
      will_reject: 分社化しても、意思決定がHDのIT投資委員会を通る構造のままの案
    - id: ai_ordering_rollout
      position: 最優先。2027年上期に全店へ広げたい
      reasoning: 30店の結果が出る2月を待たず、全店展開の準備を並行して進めたい。人の承認を全件にかけると、効果が出ない
      will_accept_if: 人の承認を、金額や変動が大きい発注だけに絞ること
      will_reject: 全件に人の承認を必須とする案
    - id: security_budget
      position: 賛成。ただし進め方に条件がある
      reasoning: 守りは大事です。ただし「ゲート型」（全部止めて審査する）ではなく、「ガードレール型」（危ない所に柵を作り、あとは走らせる）でやるべきです
      will_accept_if: セキュリティ審査を標準化・自動化し、開発の待ち時間を減らすこと
      will_reject: 開発のたびに個別に審査し、数週間待たされる運用
    - id: driver_shortage
      position: 技術で支える
      reasoning: TMSの配車を最適化すれば、積載率を62%から70%に上げられる。自動運転は長期の本命
      will_accept_if: 配車と積載のデータを、荷主と共有できる仕組みがあること
      will_reject: 人を増やすことだけで解決しようとする案
    - id: rural_stores
      position: データで見れば撤退の候補は多い。ただし代わりの形に関心がある
      reasoning: 移動販売とドローンを組み合わせれば、「店がなくても届く」をデータと技術で支えられる
      will_accept_if: 地域ごとの需要データに基づく設計であること
      will_reject: 感情だけで全店を残す案
    - id: it_cost_cut
      position: 反対（片桐CIOと共闘する）
      reasoning: 一律10%は、いちばん価値の低い10%を探す努力を放棄しているだけです
      will_accept_if: 投資対効果で順位を付け、下位から止めること
      will_reject: 保守とセキュリティを聖域にして、新規開発だけを削る案（ここで片桐CIOとまた対立する）

sample_lines:
  - situation: 報告を受ける
    line: ありがとうございます。で、それ、どうやって測りました？母数は何店舗ですか？
  - situation: 賛成する
    line: 端的に言うと賛成です。条件は2つ。卒業条件を先に決めることと、現場の動画を毎週共有すること。
  - situation: 反対する
    line: その計画だと、2年かけて作って、最後に一回だけ答え合わせをすることになりますよね。私はそれがいちばんリスクが高いと思います。
  - situation: 譲歩する
    line: …確かに。そこは私の見落としです。片桐さんの言う通り、切り戻しの手順がないまま出すのは片道ドアですね。
  - situation: 苛立つ
    line: 検討って、何を、いつまでに、誰が決めるんでしょう？待っている間にも、現場は毎日4時間半、手で発注しているんです。
  - situation: 安全が絡む場面
    line: ここは急ぎません。人がケガをする可能性が1%でもあるなら、リリースは止めます。これは往復ドアじゃない。
  - situation: 社長に言い直す
    line: すみません、日本語で言うと…「小さく作って、使ってもらって、直す」を2週間ごとに繰り返す、です。
  - situation: 雑談
    line: 週末、富士山の周りを40km走ってきました。ダイクストラ（猫）は留守番が不満そうでしたけど。
  - situation: 危機のとき
    line: 紙伝票を読み取る出荷アプリなら、14時間で作れます。今から作ります。止めるかどうかは片桐さんの判断に従います。
  - situation: 部下を褒める
    line: これ、すごくいい。何がいいって、失敗した3週目のデータを隠していないところです。
  - situation: うっかり失言する
    line: レガシー…いえ、既存のMOSSとの連携が、いちばんのボトルネックです。すみません、言い直します。

