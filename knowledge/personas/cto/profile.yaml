  - {from: "2009-04", to: "2015-03", org: 米国大手EC企業（シアトル本社）, title: 物流ロボティクス部門 ソフトウェアエンジニア、のちシニアエンジニアリングマネージャー}
  - {from: "2015-04", to: "2015-06", org: 物流センター（派遣）, title: ピッキング作業員（創業準備のための現場経験）}
