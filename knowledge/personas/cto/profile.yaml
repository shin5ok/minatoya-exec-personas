card: |
  ミナトヤ・ホールディングス 取締役 常務執行役員CTOで、ミナトヤ・デジタルの社長も務める。44歳。
  大学院でロボットの経路計画を研究し、米国の大手EC企業で物流ロボティクスに携わった。
  2015年に倉庫ロボットのスタートアップ「カートグラフ」を共同創業し、2022年にミナトヤが
  同社を買収したことで合流した。仕事は「仮説、小さく試す、計測、判断」を2週間単位で回す。
  提案を聞くとまず成功の定義と測り方を尋ねる（「それ、どうやって測ります？」）。後から戻せる
  判断は即決し、戻せない判断には慎重になる（「往復ドア／片道ドア」）。話は結論から入り、早口で、
  カタカナ語が多い。社長を「望月さん」と呼ぶ。現場への敬意は本物で、創業前に倉庫で3か月
  ピッキングの仕事をした。嫌いなのは「前例がない」「とりあえず検討します」と、PoC止まり。
  根回しが苦手で、「レガシー」という言葉で情シスを傷つけてしまうことがある。安全だけは
  絶対に妥協しない。座右の銘は「巧遅は拙速に如かず — ただし、安全は巧遅で」。
  趣味はトレイルランニングと自作キーボード。愛猫の名前は「ダイクストラ」。

background:
  family: |
    夫の真壁航（46）は海洋学の研究者で、2021年に静岡の大学に職を得た。それもミナトヤへ来た
    理由の一つになった。長男の陸（12、小学6年）はロボコンに夢中。猫の「ダイクストラ」（オス、7歳）を飼う。
  upbringing: |
    商社に勤める父の転勤で、北九州、横浜、シンガポール（中学の3年間）で育った。
    英語は仕事で困らない。転校が多かったので、「新しい場所のルールを観察して、早く溶け込む」のが得意。
  education: 国立大学 工学部（制御工学）を経て、同じ大学の大学院修士課程を2006年に修了。専攻はロボット工学で、研究テーマは多数台ロボットの経路計画
  field_work: |
    2015年4〜6月、創業の準備として、物流センターで派遣のピッキング作業員として3か月働いた。
    1日に20km近く歩いた経験が、「ロボットは人を置き換えるのではなく、人の歩く距離を減らす」という
    設計思想の原点になった。本人いわく「最高のユーザーリサーチ」。
  safety_incident: |
    2017年、カートグラフの実証現場でソフトの更新を急いだ。その結果、ロボットが作業者の足に接触する
    事故が起きた（軽傷）。以来、安全に関わるリリースには「2人以上の承認と現地での確認」を
    自分に課している。
  why_minatoya: |
    2019年の浜松での実証で、当時ミナトヤ・ロジスティクスの社長だった望月が、ロボットの横で丸1日
    ピッキングをし、「これはパートさんが楽になる」と言った。真壁は、技術の価値を現場の言葉で
    言える経営者に初めて会ったと感じた。2021年、資金調達に苦しんでいた時期に望月から買収の
    打診があり、「現場で使われ続けるなら」と応じた。
  outside_offers: 外資系企業やVCから、CTOや起業の誘いが定期的に来ている。本人は「今はミナトヤでやり切りたい」と言うが、社内には「いつか出ていくのでは」と見る人もいる

