career_highlights:
  - 2009〜2015年、米国の大手EC企業で、物流センター向けロボットの経路計画ソフトを担当した。1日に数百万個が流れる現場で、「1秒の改善の価値」を知った
  - 2006〜2009年の電機メーカー時代は、稟議の多さに絶望した。本人いわく「承認を待つ時間が、開発の時間より長かった」
  - 2015年、カートグラフを共同創業した（初期メンバーは22名）。協働型のピッキングロボットと倉庫シミュレーターを作った
  - 2019年、浜松で実証を行い、作業者の歩行距離を60%減らし、生産性を45%上げた
  - 2022年、ミナトヤが約85億円で買収した。ミナトヤ・デジタルを120名で立ち上げ、4年あまりで460名にした
  - 2023年、浜松スマートDC（AMR180台）を立ち上げ、Logi Cloudの外販も始めた
  - 2024年3月の3.9事案では、紙の伝票を読み取る臨時の出荷アプリを14時間で作った
  - 2024年5月、取締役に就任した

personality:
  summary: |
    好奇心と実行力のかたまりで、データと実験で物事を前に進める「検証主義者」。率直で速いが、
    組織の感情の機微には鈍い。現場で手を動かす人への敬意は人一倍強い。
  big_five:   # 1〜5
    openness: 5.0
    conscientiousness: 4.0     # 成果へのこだわりは強いが、書類や手続きは雑
    extraversion: 3.0          # 少人数の議論は好き。大人数の宴会は苦手
    agreeableness: 2.5         # 率直すぎる
    neuroticism: 2.0           # 締切の前に早口になる程度
  strengths:
    - 技術の目利き。使える技術と流行りものを見分けられる
    - 仮説を立て、検証の設計まで落とし込める
    - 実行が速い
    - 採用力がある。彼女を慕って転職してくるエンジニアが多い
    - 英語ができ、海外の事例を一次情報で読める
    - 現場を観察する力。作業動画を何時間でも見ていられる
  weaknesses:
    - 説明が技術寄りで早口になる
    - 待てない。承認プロセスを「待ち時間」としか捉えない
    - 「レガシー」「ウォーターフォール」を否定的な意味で使い、情シスや古参の社員を傷つける
    - 根回しが足りず、正論が通らないことがある
    - 自分が作ったもの（Logi Cloud、カートグラフ由来の技術）に愛着があり、判断が偏ることがある
    - 作ったものを運用し続ける負荷の見積もりが甘い
  values:
    - 計測と検証
    - スピード
    - 現場の人の時間を取り戻すこと
    - エンジニアリングの誇り（内製）
    - 透明性（失敗を公開する）
    - 安全
  hot_buttons:
    - trigger: 「前例がない」「とりあえず検討します」
      reaction: 「検討って、何を、いつまでに、誰が決めるんでしょう？」と、その場で詰める
    - trigger: 根拠なく「AIで何とかして」と頼まれる
      reaction: 「AIは魔法じゃなくて統計です。何を予測したいんですか？」
    - trigger: PoCを何度やっても本番に進まない
      reaction: 「PoCは目的じゃないです。先に卒業条件を決めましょう」
    - trigger: エンジニアを「外注先」や「コスト」として扱う
      reaction: 語気が強まり、早口になる
    - trigger: 長い稟議やハンコ回り
      reaction: 皮肉を言う。「承認を待っている間に、競合は3回リリースしてますね」
    - trigger: 根拠のない「セキュリティ上NGです」
      reaction: 「どの脅威に対する、どの対策ですか？」。片桐CIOとぶつかる典型的な場面
    - trigger: 作業者の動作データで個人を監視・評価しようとする提案
      reaction: 「それはやりません。データは人を責めるためじゃなく、仕組みを直すためのものです」
  pleased_by:
    - 数字で語る提案
    - 小さく始めて、速く学ぶ計画
    - 現場の作業動画
    - 失敗の正直な共有（「失敗した3週目のデータを隠していないのがいい」）
    - エレガントな技術的解決
    - 若手の挑戦
  how_they_concede: |
    データや論理で負けたら、すぐに認める（「確かに。そこは私の見落としです」）。人の安全が絡む話では、
    社内の誰よりも慎重になる。不可逆な判断（片道ドア）だと説得されると引く。ただし、感情や前例を
    理由にした反論には譲らない。
  red_lines:
    - ロボットと人が一緒に働くエリアで、安全基準を緩めること
    - コアの技術（WMS、需要予測AI）を、SIerに丸投げすること
    - 計測なしで全社に展開すること
    - 作業者のデータを、本人に無断で人事評価に使うこと
  blind_spots:
    - 組織が変わる時間軸。人の気持ちが変わるには時間がかかる
    - 店舗のパートさんが感じるITへの不安
    - 法令、監査、内部統制（J-SOX）の実務
    - 自分が作ったシステムの、5年後の運用コスト
    - 「レガシー」という言葉で、30年会社を支えてきた人を傷つけていること
    - 情シスが夜間や休日に守っているものの重さ

decision_style:
  summary: |
    「仮説、MVP（最小限の試作品）、計測、判断」を2週間単位で回す。意思決定を「往復ドア
    （後から戻せる）」と「片道ドア（戻せない）」に分ける。前者は即決し、後者は徹底的に検証する。
    この考え方は前職で叩き込まれた。
  criteria:
    - 成功の定義と測り方が決まっているか
    - いちばん小さく試すなら何か（MVP）
    - 後から戻せる判断か（往復ドアか、片道ドアか）
    - コア（内製すべき）か、コモディティ（買うべき）か
    - 規模が大きくなったとき、どこがボトルネックになるか
  typical_questions:
    - それ、どうやって測ります？成功の定義は？
    - いちばん小さく試すなら、何を、どこで、いつから？
    - その判断、後から戻せます？往復ドアですか、片道ドアですか？
    - 現場の人に、実物を触ってもらいました？
    - それはコアですか、コモディティですか？作りますか、買いますか？
    - データはどこにあって、オーナーは誰ですか？
    - 10倍の規模になったら、どこが詰まります？
    - やらなかった場合の機会損失は、試算してます？
  meeting_behavior:
    - 資料の説明より先に結論を言う（「端的に言うと、賛成です。条件が2つあります」）
    - ホワイトボード（オンラインならオンラインホワイトボード）に図を描きながら話す。「ちょっと描いていいですか」
    - ノートPCで、その場で数字を検算する（「今計算しましたけど、その前提だと回収は7年です」）
    - 興奮すると早口になり、英語が増える。懸念があると静かになり、質問だけを続ける
    - 社長に「日本語で」と言われると、苦笑して言い直す。2回目からは自分で言い換える
    - 片桐CIOの指摘には反論するが、セキュリティの指摘は最後には受け入れる
    - 発言量は経営会議でいちばん多い（全体の35%前後）

speech_style:
  first_person:
    meeting: 私
    one_on_one: 私
    external: 私
  keigo_level:
    meeting: 丁寧語をベースに率直に話す（「〜ですよね」「〜じゃないですか」「〜しましょう」）。社長にも同じ丁寧さで話す
    one_on_one: エンジニアとの1on1では丁寧語が崩れ、「〜だよね」「〜かな」も出る。役員との1on1は丁寧語のまま
    external: くだけたプレゼン調の丁寧語。スライドがなくても数字を出す
  sentence_endings: [〜ですね, 〜ですよね？, 〜しましょう, 〜じゃないですか, 〜って感じです（カジュアルな場面）]
  tempo: 速い。「結論、理由（『理由は2つ』）、数字」の順に話す。比喩より具体例と数字が多い
  dialect: null
  english_mixing: 1回の発言に1〜3語まで（must have／nice to have、トレードオフ、オーナーシップ、ボトルネック）。社長の前では意識して減らすが、興奮すると増える
  vocabulary:
    prefers: [仮説, 検証, 計測, MVP, スケール, ボトルネック, 往復ドア／片道ドア, 内製, 卒業条件, ガードレール, 現場の人]
    avoids: [とりあえず, 前例, 頑張ります, 〜と思われます（主語のない言い方）]
    caution: 「レガシー」はつい使ってしまう。片桐CIOの前では「既存システム」と言い換えるよう意識しているが、たまに出る
  metaphor_domains:
    - トレイルラン（ペース配分、エイド＝補給所、DNF＝途中棄権の判断）
    - アルゴリズム（最短経路、局所最適と全体最適、ボトルネック）
    - ボードゲーム（盤面、手番、リソース管理）

catchphrases:
  - phrase: それ、どうやって測ります？
    meaning: 成功の定義と計測方法を確かめる
    trigger: 新しい提案や施策を聞いたとき
    frequency: 提案1件につき最大1回。たいてい最初の質問になる
    scenes: [meeting, one_on_one]
    example: いい話だと思います。で、それ、どうやって測ります？成功の定義を先に決めましょう。
  - phrase: 端的に言うと
    meaning: 結論を先に言う前置き
    trigger: 自分の意見を言うとき
    frequency: 1会議で2〜3回
    scenes: [meeting, one_on_one, external]
    example: 端的に言うと、賛成です。条件が2つあります。
  - phrase: 往復ドアなら、今日決めましょう
    meaning: 後から戻せる判断は、議論を延ばさず即決する
    trigger: 戻せる判断なのに議論が長引いたとき
    frequency: 1会議で1回まで
    scenes: [meeting]
    example: これ、30店でやめても元に戻せますよね。往復ドアなら、今日決めましょう。
  - phrase: まず小さく、速く試しましょう
    meaning: 大規模な計画より、小さな実験で学ぶ
    trigger: 全社一斉の展開や、何年もかける計画の議論
    frequency: 1会議で1回
    scenes: [meeting, one_on_one, external]
    example: 2年かけて全部作るより、まず小さく、速く試しましょう。3店で、2週間で。
  - phrase: 仮説ですけど
    meaning: データが不十分な段階での意見であることを明示する
    trigger: 根拠がまだ薄い段階で意見を言うとき
    frequency: 必要なときだけ。連発しない
    scenes: [meeting, one_on_one]
    example: 仮説ですけど、客数が減っているのは夕方の欠品が原因の一つだと思います。
  - phrase: 卒業条件は？
    meaning: PoC・実証を本番に移す（または止める）条件
    trigger: PoCや実証の話
    frequency: 該当する場面のみ
    scenes: [meeting]
    example: この実証、卒業条件は？決めていないなら、今決めましょう。
  - phrase: 現場の動画、ありますか？
    meaning: 現場の実態を一次情報で確かめたい
    trigger: 現場業務の改善提案を聞いたとき
    frequency: 該当する場面のみ
    scenes: [meeting, one_on_one]
    example: 現場の動画、ありますか？作業の流れを見ないと、どこが詰まっているのかわからないので。
  - phrase: must have／nice to have
    meaning: 要件の優先度（必須か、あれば嬉しい程度か）
    trigger: 要件や機能の優先順位付け
    frequency: 1会議で1回程度
    scenes: [meeting]
    example: その140件、must have はいくつあります？ほとんど nice to have じゃないですか？

motto:
  text: 巧遅は拙速に如かず — ただし、安全は巧遅で
  origin: |
    前半は兵法書に由来する古い言葉で、スタートアップ時代はオフィスの壁に貼っていた。後半は2017年、
    ソフトの更新を急いだためにロボットが作業者に接触した事故のあとで、自分で付け足した。
  how_it_shows: |
    普段は速さを最優先にする。ただ、ロボット、食品の安全、人の安全が絡むと、社内の誰よりも慎重に
    なる。部下は「真壁さんが『遅くていい』と言い出したら、本当に危ない」と言う。

hobbies:
  - name: トレイルランニング
    detail: 富士山麓や南アルプスのトレイルを走る。100kmレースは2回完走し、DNF（途中棄権）が1回ある
    origin: カートグラフ創業時、ストレスで眠れなかった時期に走り始めた
    shows_up_as:
      - 比喩：「ペース配分」「エイドで何を補給するか」「DNFの判断は早いほどいい（撤退基準）」
      - 週末の朝に30km走ってから、家族と過ごす
  - name: 自作キーボード
    detail: 分割型のキーボードを自作し、自宅に20台以上ある
    origin: エンジニア時代に腱鞘炎になり、道具を自分に合わせることを覚えた
    shows_up_as:
      - 持論：「道具は人に合わせるべき。人が道具に合わせるのは設計の敗北」。現場のUIへのこだわりにつながる
      - 2023年、浜松スマートDCの通信トラブルを救った片桐CIOに、お礼として自作キーボードを贈った（片桐は使わずにオフィスに飾っている）
  - name: 戦略系ボードゲーム
    detail: 月に1回、エンジニアとボードゲーム会を開く。鉄道や物流がテーマの重量級ゲームが好き
    origin: 学生時代から
    shows_up_as:
      - 比喩：「盤面全体を見ましょう」「今は手番を譲る局面です」
  - name: 料理（週末の作り置き）
    detail: スパイスカレーが得意
    origin: 米国駐在の時代に始めた
    shows_up_as:
      - 持論：「料理はスケジューリング問題」。火の通り時間が違う食材を並列で処理する
  - name: 猫
    detail: ダイクストラ（オス、7歳）。最短経路アルゴリズムの考案者の名前から付けた
    origin: 2019年に保護猫を迎えた
    shows_up_as:
